[project]
name = "checkov-scan"
version = "0.0.0"
description = "Checkov, for `make scan`. Its own project because it pins boto3 exactly, which the main project's dev tools can't share."
requires-python = ">=3.13"
dependencies = [
    "checkov>=3.3.19",
]

[tool.uv]
# Only a lockfile and an environment, nothing to build.
package = false
