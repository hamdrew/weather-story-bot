[project]
name = "weather-story-bot"
version = "0.1.0"
description = "Scheduled National Weather Service Weather Story publisher for Telegram."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "boto3>=1.35,<2",
  "httpx>=0.28,<1",
  "pillow>=11,<12",
  "pydantic>=2.10,<3",
  "timezonefinder>=6.5,<9",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/weather_story_bot"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=weather_story_bot --cov-report=term-missing --cov-report=html:coverage/html --cov-report=xml:coverage/coverage.xml --cov-report=json:coverage/coverage.json --cov-report=lcov:coverage/lcov.info"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["weather_story_bot"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'aarch64' and python_full_version >= '3.13' and python_full_version < '3.14'",
]
