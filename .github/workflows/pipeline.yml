# Checks every change, plans both environments for pull requests, and deploys main: staging, then
# production after approval (infra/pipeline).
#
# The repository is public, so every log here is world-readable. Tfvars come from secrets and the
# values that would print are sensitive in Terraform (infra/environments). Saved plans hold them in
# plain text, so a plan file never becomes a GitHub artifact.
#
# AWS access is GitHub OIDC into the roles infra/bootstrap creates, each assumable from one exact
# subject. id-token: write is granted only to jobs that run no project tests, so third-party test
# and lint code never shares a job with AWS credentials.
#
# Pushes to main also deploy: staging applies, then production's plan is saved and, after your
# approval, applied. Each apply job names a GitHub environment, so its OIDC subject is the one
# only that environment's apply role trusts, and the environment's rules (main only, plus a
# reviewer for production) gate it. The plan roles stay repository-level.
#
# Repository settings it needs (Settings > Secrets and variables > Actions):
#   variables  AWS_ACCOUNT_ID, AWS_REGION, TF_STATE_BUCKET
#   secrets    STAGING_TFVARS, PRODUCTION_TFVARS (each environment's whole .tfvars file)
# Repository-level, not environment-level: a job that names a GitHub environment gets a different
# OIDC subject, and the pull-request role trusts only <sub_claim_prefix>:pull_request.

name: pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request replaces its running checks. Every other run gets a group of its
# own, so checks on main are never held up or cancelled. Deploys serialize on their own group, set
# on the deploy jobs below.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tool versions come from mise.toml (global/tooling). The action installs mise itself from
      # the newest release at least 7 days old, the same rule mise.toml applies to the tools.
      # mise.lock fixes the tool versions and the action installs --locked, so a stale cache can't
      # change what runs; the key follows both files so a changed lock is a miss. The plan job,
      # which holds credentials, has no cache.
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          minimum_release_age: 7d
          install_args: --locked
          cache_key: "mise-{{platform}}-p{{cache_period}}-${{ hashFiles('mise.toml', 'mise.lock') }}"

      # zizmor's online audits (impostor commits, known-vulnerable actions) need a token. Only this
      # step gets it: the job's read-only token, which never reaches the lint, test or scan code
      # below. Those run lint-actions again without it, offline, as they do on a laptop.
      - name: Lint workflows (zizmor online)
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run lint-actions

      - name: Lint, tests, Terraform tests, scan
        run: |
          mise run lint ::: test ::: tftest ::: scan

      # The zip is content-addressed (its sha256 is the S3 key), so an unchanged build must be
      # byte-identical or every merge would upload and deploy new code.
      - name: Build twice, compare
        run: |
          mise run build
          cp build/lambda.zip.sha256 "$RUNNER_TEMP/first.sha256"
          mise run build
          echo "first:  $(cat "$RUNNER_TEMP/first.sha256")"
          echo "second: $(cat build/lambda.zip.sha256)"
          cmp "$RUNNER_TEMP/first.sha256" build/lambda.zip.sha256

  # Pull requests from branches of this repository. Dependabot's can't get an OIDC token, and a
  # fork's must never assume a role; both still get checks.
  plan:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    name: plan (${{ matrix.environment }})
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC token for ci-pr-plan; this job runs no project tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            state_key: weather-story-bot/staging/terraform.tfstate
          - environment: production
            state_key: weather-story-bot/terraform.tfstate
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      # A variable missing from the tfvars secret fails instead of waiting for input.
      TF_INPUT: "0"
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/ci-setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          environment: ${{ matrix.environment }}
          state-key: ${{ matrix.state_key }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          region: ${{ vars.AWS_REGION }}
          # Repository secrets: an environment would change the OIDC subject (see the top). Each leg
          # names its own secret, so an empty one fails write-env-config instead of falling through
          # to the other environment's file.
          tfvars: ${{ matrix.environment == 'staging' && secrets.STAGING_TFVARS || matrix.environment == 'production' && secrets.PRODUCTION_TFVARS || '' }} # zizmor: ignore[secrets-outside-env]
          role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/weather-story-bot-ci-pr-plan
          session-name: pr-plan-${{ github.run_id }}

      # Read-only: ci-pr-plan can't write the state lock, so the plan runs unlocked.
      - name: Plan
        run: mise run plan "$ENVIRONMENT" --no-lock

      # Cosmetic, so a failure here never blocks the check.
      - name: Plan summary
        continue-on-error: true
        run: mise run plan-summary "$ENVIRONMENT"

  # Merges to main. Staging first, then production's plan, then production after your approval. A
  # plan that changes nothing deploys nothing and asks for no approval. These jobs build the zip and
  # run terraform, which is project code beside AWS credentials, so they run no tests or linters.
  deploy-staging:
    if: github.event_name == 'push'
    name: deploy (staging)
    needs: checks
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write # OIDC token for ci-apply-staging
    env:
      TF_INPUT: "0"
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/ci-setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          environment: staging
          state-key: weather-story-bot/staging/terraform.tfstate
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          region: ${{ vars.AWS_REGION }}
          tfvars: ${{ secrets.STAGING_TFVARS }}
          role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/weather-story-bot-ci-apply-staging
          session-name: deploy-staging-${{ github.run_id }}

      # The apply role locks the state on its own key, so this plan locks too.
      - name: Plan
        run: mise run plan staging

      # Cosmetic, so a failure here never blocks a deploy.
      - name: Plan summary
        continue-on-error: true
        run: mise run plan-summary staging

      - name: Any changes?
        id: changes
        run: mise run --quiet plan-changes staging --github-output

      - name: Deploy
        if: steps.changes.outputs.changed == 'true'
        run: mise run deploy staging

  # Production's plan is made here, on main, by the plan role, and saved so that what you approve is
  # exactly what is applied. It is a separate job because Dependabot's pull requests get no plan.
  plan-production:
    if: github.event_name == 'push'
    name: plan (production)
    needs: deploy-staging
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC token for ci-plan
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      plan_key: ${{ steps.save.outputs.plan_key }}
    env:
      TF_INPUT: "0"
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ci-plan runs on main only and, unlike ci-pr-plan, may write production's plan key.
      - uses: ./.github/actions/ci-setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          environment: production
          state-key: weather-story-bot/terraform.tfstate
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          region: ${{ vars.AWS_REGION }}
          tfvars: ${{ secrets.PRODUCTION_TFVARS }} # zizmor: ignore[secrets-outside-env]
          role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/weather-story-bot-ci-plan
          session-name: plan-production-${{ github.run_id }}

      # Read-only on state, so no lock. A plan made stale by an apply meanwhile is refused at apply.
      - name: Plan
        run: mise run plan production --no-lock

      # Cosmetic, so a failure here never blocks a deploy.
      - name: Plan summary
        continue-on-error: true
        run: mise run plan-summary production

      - name: Any changes?
        id: changes
        run: mise run --quiet plan-changes production --github-output

      # The run attempt is in the key because the bucket never lets a key be written twice, so
      # re-running this job must not collide with its first attempt. Nothing is saved when nothing
      # would change: deploy-production is skipped then.
      - name: Save the plan
        id: save
        if: steps.changes.outputs.changed == 'true'
        env:
          PLAN_KEY: plans/production/${{ github.run_id }}-${{ github.run_attempt }}.tfplan
        run: |
          mise run plan-store upload "$PLAN_KEY"
          echo "plan_key=$PLAN_KEY" >> "$GITHUB_OUTPUT"

  # Waits for your approval (the production environment's reviewer rule), then applies the saved
  # plan. Skipped, with no approval asked, when the plan changes nothing: a job's `if` is decided
  # before its environment's rules.
  deploy-production:
    if: github.event_name == 'push' && needs.plan-production.outputs.changed == 'true'
    name: deploy (production)
    needs: plan-production
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC token for ci-apply-production
    env:
      TF_INPUT: "0"
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/ci-setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          environment: production
          state-key: weather-story-bot/terraform.tfstate
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          region: ${{ vars.AWS_REGION }}
          tfvars: ${{ secrets.PRODUCTION_TFVARS }}
          role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/weather-story-bot-ci-apply-production
          session-name: deploy-production-${{ github.run_id }}

      - name: Download the approved plan
        env:
          PLAN_KEY: ${{ needs.plan-production.outputs.plan_key }}
        run: mise run plan-store download "$PLAN_KEY"

      # deploy rebuilds and refuses a zip that isn't the one the plan was made for.
      - name: Deploy
        run: mise run deploy production
