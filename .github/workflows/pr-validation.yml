name: Pull Request Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python project
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.7"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"

      - name: Validate dependency lock
        run: uv lock --check

      - name: Synchronize locked development dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run --locked ruff format --check src tests

      - name: Run static checks
        run: |
          make lint
          make typecheck

      - name: Run unit tests
        run: make test

      - name: Publish coverage summary
        if: always()
        run: |
          uv run --locked python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          root = ElementTree.parse("coverage/coverage.xml").getroot()
          line_rate = float(root.attrib["line-rate"]) * 100
          branch_rate = float(root.attrib["branch-rate"]) * 100
          indicator = "🟢" if line_rate >= 90 else "🟡" if line_rate >= 75 else "🔴"
          summary = (
              "## Coverage\n\n"
              "| Metric | Result | Target |\n"
              "| --- | ---: | ---: |\n"
              f"| Line rate | {line_rate:.2f}% | ≥ 75% (≥ 90% healthy) |\n"
              f"| Branch rate | {branch_rate:.2f}% | visible; no gate |\n\n"
              f"{indicator} Line-rate status\n"
          )
          print(summary)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary, encoding="utf-8")
          if line_rate < 75:
              raise SystemExit("Coverage line rate is below the 75% minimum.")
          PY
