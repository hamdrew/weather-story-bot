name: Feature request
description: Suggest a public, non-sensitive improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private identifiers, personal data, or logs. Use SECURITY.md for vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
