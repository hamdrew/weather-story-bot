name: Bug report
description: Report a reproducible problem without sensitive operational data.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Do not include tokens, credentials, private IDs, invite links, personal data, raw payloads, or unbounded logs. Use SECURITY.md for vulnerabilities.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Provide a concise, sanitized description.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction steps
      description: Use non-secret, mock-only or publicly available inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
